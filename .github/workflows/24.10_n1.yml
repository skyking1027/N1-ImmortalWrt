name: Build ImmortalWrt-24.10 for N1

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false
  schedule:
    - cron: '0 16 * * 0'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_REF: v24.10.5
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: 检查Actions
      uses: actions/checkout@main

    - name: 释放空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 增加SWAP防止OOM
      run: |
        sudo fallocate -l 6G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh | sudo bash > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_REF --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 更新并安装feeds
      working-directory: ./openwrt
      run: |
        chmod +x $GITHUB_WORKSPACE/diy-1.sh || true
        $GITHUB_WORKSPACE/diy-1.sh || true
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置 & 禁用Rust
      working-directory: ./openwrt
      run: |
        chmod +x $GITHUB_WORKSPACE/diy-2.sh || true
        $GITHUB_WORKSPACE/diy-2.sh || true
        rm -rf ./files ./.config
        mv "$GITHUB_WORKSPACE/files" ./files 2>/dev/null || true
        mv "$GITHUB_WORKSPACE/.config" ./.config 2>/dev/null || true

        # 强制禁用 Rust，解决编译报错
        echo "CONFIG_PACKAGE_rust=n" >> .config
        echo "CONFIG_HOST_RUST=n" >> .config
        echo "CONFIG_RUST_SUPPORT=n" >> .config

    - name: SSH连接到Actions
      uses: P3TERX/ssh2actions@main
      if: github.event.inputs.ssh == 'true'

    - name: 下载软件包
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j$(nproc)
        find dl -size -1k -exec ls -l {} \;
        find dl -size -1k -exec rm -f {} \;

    - name: 编译N1固件
      working-directory: ./openwrt
      run: |
        echo -e "可用核心数：$(nproc)"
        make -j1 V=s  # 单线程稳定编译，彻底避免rust/oom错误

    - name: 打包ARM内核
      uses: unifreq/openwrt_packit@master
      env:
        OPENWRT_ARMVIRT: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
        OPENWRT_VER: ${{ env.REPO_REF }}
        KERNEL_REPO_URL: breakingbadboy/OpenWrt
        KERNEL_VERSION_NAME: 6.6.y
        PACKAGE_SOC: diy
        GZIP_IMGS: .xz
        SCRIPT_DIY_PATH: mk_s905d_n1.sh
        WHOAMI: Winnie-0721
        SW_FLOWOFFLOAD: 0
        SFE_FLOW: 0

    - name: 发布固件
      uses: softprops/gh-release@main
      with:
        tag_name: ImmortalWrt_${{ env.PACKAGED_OUTPUTDATE }}
        files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.xz
        body: |
          首次使用建议全新刷写
          * 基本信息
          默认开启 DHCP
          账户: root
          密码: password

    - name: 删除运行记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 3
        keep_minimum_runs: 4
        token: ${{ env.GITHUB_TOKEN }}

    - name: 删除旧固件
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 2
        delete_tags: true
